# Supabase (offre gratuite) met en pause les projets inactifs depuis 7 jours.
# Ce petit ping hebdomadaire garde la base de suivi des clics active.
name: keepalive
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          URL=$(jq -r .tracking.supabaseUrl site.config.json)
          KEY=$(jq -r .tracking.publishableKey site.config.json)
          curl -fsS -X POST "$URL/rest/v1/clicks" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" -d '{"offer_id":"__keepalive","src":"cron","is_bot":true}'
